name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # (The on-chain contracts job + nightly real-verifier were removed in the
  # 2026-06-19 redesign — the architecture is now a self-hosted server, not a
  # smart-contract chain. See docs/superpowers/specs/2026-06-19-tessera-system-design.md.
  # A `server` job for codes/server is added once it gains real tests (Task 1.6).)
  # (The React/Vite frontend job was removed — the frontend is deprecated and
  # deleted; the Flutter app `app` job below is the canonical web/client gate.)

  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: codes/relayer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Tessera workspace (codes/app — the sole client since the cutover).
  # Pub workspace + melos: per-package analyze + tests, then the shell's web
  # build as the compile gate.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run melos run format:check
      - run: dart run melos run analyze
      - run: dart run melos run test
      # Icon tree-shaking ON — saves ~1.84MB of icon fonts fetched before
      # first paint (verified: the workspace has no non-const IconData).
      - run: flutter build web
        working-directory: codes/app/apps/tessera
      # Publish the static web build as a downloadable artifact. This is the
      # site you deploy to Cloudflare Pages (or any static host) — point it at
      # your backend in-app via Settings → Network, then reload.
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-web
          path: codes/app/apps/tessera/build/web
          retention-days: 14

  # Android release APK. Separate from `app` so an Android/Gradle hiccup never
  # blocks the web gate. Release uses debug signing (android/app/build.gradle.kts),
  # so the APK is installable for testing without a release keystore.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/app/apps/tessera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-apk
          path: codes/app/apps/tessera/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
