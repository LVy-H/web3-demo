name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: codes/contracts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # (The React/Vite frontend job was removed — the frontend is deprecated and
  # deleted; the Flutter app `mobile` job below is the canonical web/client gate.)

  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: codes/relayer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Flutter recurring-member app (codes/mobile). Runs the VM test suite
  # (browser-only ZK test is @TestOn('browser') → skipped here; the on-chain
  # integration test self-skips with no local node).
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release guardrail: the canonical web build must compile. Icon
      # tree-shaking stays ON (no const-less IconData anywhere): it cuts
      # MaterialIcons 1645KB→~13KB + CupertinoIcons 257KB→~1.5KB, both fetched
      # before first paint on web.
      - run: flutter build web
      # Publish the static web build as a downloadable artifact. This is the
      # site you deploy to Cloudflare Pages (or any static host) — point it at
      # your backend in-app via Settings → Network, then reload.
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-web
          path: codes/mobile/build/web
          retention-days: 14

  # Tessera Revolution workspace (codes/app — spec 2026-06-11, phase R1+).
  # Pub workspace + melos: per-package analyze + tests, then the shell's web
  # build as the compile gate. The legacy `mobile` job above stays the gate for
  # codes/mobile until the R-phase cutover PR.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run melos run analyze
      - run: dart run melos run test
      # Icon tree-shaking ON — saves ~1.84MB of icon fonts fetched before
      # first paint (verified: the workspace has no non-const IconData).
      - run: flutter build web
        working-directory: codes/app/apps/tessera

  # Android release APK. Separate from `mobile` so an Android/Gradle hiccup never
  # blocks the web gate. Release uses debug signing (android/app/build.gradle.kts),
  # so the APK is installable for testing without a release keystore.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-apk
          path: codes/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
