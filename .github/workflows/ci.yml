name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: codes/contracts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # (The React/Vite frontend job was removed — the frontend is deprecated and
  # deleted; the Flutter app `mobile` job below is the canonical web/client gate.)

  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: codes/relayer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Flutter recurring-member app (codes/mobile). Runs the VM test suite
  # (browser-only ZK test is @TestOn('browser') → skipped here; the on-chain
  # integration test self-skips with no local node).
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release guardrail: the canonical web build must compile.
      - run: flutter build web --no-tree-shake-icons
