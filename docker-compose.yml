# DEV ONLY — not for production. Ports bound to loopback only.
version: '3.8'

services:
  contracts:
    build:
      context: ./codes/contracts
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - ./codes/contracts:/app
      - ./codes/frontend/src:/app/frontend/src
      - /app/node_modules

  frontend:
    build:
      context: ./codes/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_RPC_URL=https://bike-knife-jewelry-collaborative.trycloudflare.com
    depends_on:
      - contracts
    volumes:
      - ./codes/frontend:/app
      - /app/node_modules

  # T-D: relayer service wiring. The image is built from codes/relayer/,
  # which is being ported in by T-B (branch imp/T-B-*). Until T-B lands on
  # main, `docker compose up relayer` will fail to build — that's expected.
  # Defaults mirror codes/relayer/src/config.ts (port 3001, hardhat dev key).
  relayer:
    build:
      context: ./codes/relayer
    ports:
      - "3001:3001"
    environment:
      - RPC_URL=http://contracts:8545
      - RELAYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - PORT=3001
    depends_on:
      - contracts
    volumes:
      - ./codes/relayer:/app
      - /app/node_modules

  explorer:
    image: alethio/ethereum-lite-explorer
    ports:
      - "3728:80"
    environment:
      - APP_NODE_URL=http://localhost:8545
    depends_on:
      - contracts
