# DEV ONLY — not for production. Ports bound to loopback only.
#
# The 2026-06-19 redesign replaced the on-chain stack (hardhat contracts +
# relayer + block explorer) with a single self-hosted server. The Flutter client
# runs via `flutter run` (not docker). The local one-liner is `./dev-stack.sh up`.
# The server is a skeleton today (health route); compose grows with Phases 2-3.

services:
  server:
    build:
      context: ./codes/server
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
