version: '3.8'

services:
  contracts:
    build:
      context: ./contracts
    ports:
      - "8545:8545"
    volumes:
      - ./contracts:/app
      - ./frontend/src:/app/frontend/src
      - ./relayer/src/abi:/app/relayer/abi
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_RPC_URL=http://127.0.0.1:8545
      - VITE_RELAYER_URL=http://127.0.0.1:3001
    depends_on:
      - contracts
    volumes:
      - ./frontend:/app
      - /app/node_modules

  relayer:
    build:
      context: ./relayer
    ports:
      - "3001:3001"
    environment:
      - RPC_URL=http://contracts:8545
      - RELAYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - PORT=3001
    depends_on:
      - contracts
    volumes:
      - ./relayer:/app
      - /app/node_modules

  explorer:
    image: alethio/ethereum-lite-explorer
    ports:
      - "3728:80"
    environment:
      - APP_NODE_URL=http://localhost:8545
    depends_on:
      - contracts
