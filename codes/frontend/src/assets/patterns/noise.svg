<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Procedural film-grain noise via feTurbulence. Low opacity so it sits under other layers. -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.165
                           0 0 0 0 0.192
                           0 0 0 0 0.250
                           0 0 0 0.12 0"/>
  </filter>
  <rect width="300" height="300" filter="url(#noise)"/>
</svg>
