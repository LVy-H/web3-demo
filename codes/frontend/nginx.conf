server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router owns client-side routing, so any path that
    # doesn't match a real file must serve index.html and let the bundle
    # resolve the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed Vite assets; never cache the entry HTML.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
