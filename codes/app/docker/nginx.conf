# Tessera Flutter-web vhost (used by Dockerfile.web).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz siblings precompressed at image-build time (zero CPU per
    # request); fall back to on-the-fly gzip for anything not precompressed.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/json
               application/wasm text/css text/plain image/svg+xml
               font/otf font/ttf application/octet-stream;

    # Never cache the entry points: index.html + flutter_bootstrap.js decide
    # which build the browser runs; version.json + flutter_service_worker.js
    # drive Flutter's own update flow. main.dart.js is NOT content-hashed by
    # Flutter, so it revalidates too — ETag 304s keep repeat loads cheap.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|main\.dart\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Long-lived immutable caching for the big static payloads (canvaskit,
    # asset bundle, icons). Flutter's service worker re-fetches changed CORE
    # resources with cache:'reload' on a new build, so a no-cache index +
    # immutable payloads is the standard Flutter-web hosting shape.
    location ~* ^/(canvaskit/|assets/|icons/) {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Container healthcheck target — no log noise, no filesystem hit.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # SPA fallback: go_router paths (/join, /vote/…, /organize, /you) are
    # client-side routes — deep links and reloads must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
