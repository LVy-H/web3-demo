# Tessera Revolution workspace root (spec §6, R1).
#
# Dart pub workspace: one shared resolution for the app shell + the core
# packages. Melos (v7) runs on top of it — its configuration lives in the
# `melos:` section below (melos 7 dropped the standalone melos.yaml in favor
# of the workspace root pubspec). See codes/app/melos.yaml for the pointer.
name: tessera_workspace
description: "Tessera Revolution — pub workspace for the app shell and core packages."
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - apps/tessera
  - packages/core_chain
  - packages/core_crypto
  - packages/core_domain
  - packages/core_relay
  - packages/core_storage
  - packages/design_system
  - packages/feature_join
  - packages/feature_organize
  - packages/feature_vote
  - packages/feature_you

dev_dependencies:
  melos: ^7.1.0

melos:
  scripts:
    analyze:
      description: Static analysis in every package (the client CI gate).
      run: dart run melos exec --concurrency=1 -- dart analyze --fatal-infos .

    test:
      description: Every package's test suite (dart test for pure-Dart packages, flutter test elsewhere).
      run: dart run melos run test:dart && dart run melos run test:flutter

    test:dart:
      description: Pure-Dart packages (no Flutter anywhere in their dev graph).
      run: dart run melos exec --concurrency=1 --scope="core_domain" --scope="core_chain" -- dart test

    test:flutter:
      description: Flutter packages + packages whose tests need flutter_test (goldens EXCLUDED — see test:golden).
      # feature_join's grammar is pure-Dart, but its JOIN-surface widgets
      # (lib/ui.dart) now carry a widget test (camera-denied fallback), so the
      # whole package runs under `flutter test` (a superset that also runs its
      # package:test grammar/relay-port suites).
      #
      # `--exclude-tags golden` keeps the CI-excluded visual-audit harness
      # (apps/tessera/test/golden/, @Tags(['golden'])) OUT of the default run:
      # golden pixels are platform-/engine-dependent and MUST NOT gate CI.
      # Run them on demand with `test:golden`.
      run: dart run melos exec --concurrency=1 --dir-exists=test --ignore="core_domain" --ignore="core_chain" -- flutter test --exclude-tags golden

    test:golden:
      description: The CI-EXCLUDED visual-audit harness — renders UI surfaces to PNG goldens for human/agent inspection. Regenerate with `flutter test --tags golden --update-goldens`; never gate CI on these.
      run: dart run melos exec --scope="tessera" -- flutter test --tags golden

    format:
      description: Format all packages in place.
      run: dart run melos exec --concurrency=1 -- dart format .

    format:check:
      description: Fail when any file is unformatted (CI gate).
      run: dart run melos exec --concurrency=1 -- dart format --output=none --set-exit-if-changed .
