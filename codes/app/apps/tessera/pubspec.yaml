name: tessera
description: "Tessera — one app for anonymous on-chain voting. Revolution shell (R2f): guarded router, capabilities probe, app skeleton; real screens land in R3."
publish_to: 'none'
version: 0.4.0+1 # Self-hosted redesign line; aligned with codes/server + codes/control
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2 # declarative URL routing + deep links (guarded, R2f)
  provider: ^6.1.2 # DI: one production provider list in the composition root
  http: ^1.2.0 # relayer reachability probe (capabilities)
  app_links: ^6.3.0 # OS deep links (tessera://) -> DeepLinkService -> router

  # Workspace packages (resolved by the pub workspace, not pub.dev).
  core_chain: any
  core_crypto: any
  core_domain: any
  core_relay: any
  core_storage: any
  design_system: any
  feature_join: any
  feature_organize: any
  feature_vote: any
  feature_you: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter # on-device e2e smoke (dev-stack.sh e2e)
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3 # Android mipmaps from the brand mark

# Launcher icons are generated from the brand mark (branding/tessera-mark.svg
# rasterized into tool/icons/). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: tool/icons/launcher_icon.png
  adaptive_icon_background: "#0A0C10" # Db.void_ (ink)
  adaptive_icon_foreground: tool/icons/launcher_foreground.png

flutter:
  uses-material-design: true

  # All contract ABIs are bundled from core_chain's package assets
  # (packages/core_chain/assets/abi/ — the canonical R4 set). The app ships
  # no local ABI copies since the R4 client migration.

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
