name: feature_join
description: "Tessera JOIN — universal entry: the pure-Dart deep-link/code grammar (lib/feature_join.dart) plus the JOIN surface and live-voter flow widgets (lib/ui.dart)."
publish_to: none
version: 0.2.0
resolution: workspace

environment:
  sdk: ^3.11.0

# Library split (R3): the grammar export `package:feature_join/feature_join.dart`
# stays importable without Flutter (its files have no Flutter imports, and its
# grammar/relay suites use `package:test`); the widgets live behind the separate
# `package:feature_join/ui.dart` export and carry widget tests, so the package's
# suite runs under `flutter test` (see the root melos `test:flutter`).
# Dependency rule (spec §6): feature_* → core_* + design_system only.
dependencies:
  flutter:
    sdk: flutter
  core_crypto: any # ephemeral identity seed + ticket decode + confirmation code
  core_domain: any # LiveVoter journey machine + Capabilities
  core_relay: any # relayer client (announce / queue / vote relay)
  design_system: any
  # The proven scanner major carried over from the legacy app (^7.2.0).
  mobile_scanner: ^7.2.0

dev_dependencies:
  test: ^1.25.0 # pure-Dart grammar tests (lib/feature_join.dart)
  flutter_test:
    sdk: flutter # widget tests for the JOIN surface (e.g. camera-error panel)
  flutter_lints: ^6.0.0
  http: ^1.2.0 # MockClient for the relay-port adapter tests
