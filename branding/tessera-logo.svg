  <!-- Tessera logo lockup: tile mark + TESSERA wordmark.
       Wordmark is hand-built rect letterforms (squared 5x7 stencil grid,
       u=14, tracking 3u) - no font dependency, pure rects, no curves.
       Tokens: ink #0A0C10, chalk #F5F7FA, mute #7A8599, segnale #FF3B5C. -->
